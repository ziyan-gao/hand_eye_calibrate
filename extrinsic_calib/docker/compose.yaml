# Run from extrinsic_calib/:  docker compose -f docker/compose.yaml up -d
services:
  calib:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: camera_extrinsic_calibration:jazzy
    container_name: camera_extrinsic_calibration
    network_mode: host          # robot controller + DDS discovery
    ipc: host
    privileged: true            # RealSense USB access incl. hot re-plug
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ../src:/workspaces/calib_ws/src            # editable overlay source
      - ../.colcon/build:/workspaces/calib_ws/build  # incremental build cache (host)
      - ../.colcon/install:/workspaces/calib_ws/install
      - ../.colcon/log:/workspaces/calib_ws/log
      - ${CALIB_DATA_DIR:-../data}:/data/calibration
    stdin_open: true
    tty: true
    command: sleep infinity
